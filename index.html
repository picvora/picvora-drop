<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Picvora 隔空接收站</title>
    <!-- 引入 PeerJS 核心库 (优先使用公共 CDN，支持离线或镜像) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --border-subtle: #edf2f7;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #d97706;
            --danger: #dc2626;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #0b0f19;
                --bg-card: #131c2e;
                --bg-card-subtle: #1e293b;
                --border-color: #24324d;
                --border-subtle: #1a253a;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --primary-light: rgba(59, 130, 246, 0.15);
                --success: #22c55e;
                --success-light: rgba(34, 197, 94, 0.15);
                --warning: #f59e0b;
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* 顶部导航与状态条 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(var(--bg-card), 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-capsule {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: var(--bg-card-subtle);
            border: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .status-dot.connected {
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pulse 1.8s infinite;
        }

        .status-dot.success {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* 主体内容流 */
        .main-container {
            flex: 1;
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 状态与进度卡片 */
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* 进度条 */
        .progress-bar-wrap {
            height: 6px;
            background: var(--bg-card-subtle);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin: 8px 0;
            display: none;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            border-radius: var(--radius-full);
            transition: width 0.15s ease-out;
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 文案与标签复制专区 */
        .context-panel {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .context-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .context-text {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card-subtle);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag-item {
            font-size: 11px;
            padding: 3px 8px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-full);
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-card-subtle);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:active {
            background-color: var(--border-color);
            transform: scale(0.98);
        }

        .btn-full {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: var(--radius-lg);
        }

        /* 九宫格素材展示区 */
        .gallery-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 8px 0;
        }

        .gallery-counter {
            font-size: 13px;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gallery-card {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--bg-card-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-seq-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .card-size-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* 底部常驻保存操作面板 */
        .bottom-action-panel {
            position: sticky;
            bottom: 12px;
            z-index: 40;
            margin-top: auto;
            display: none;
        }

        /* 调试日志抽屉 */
        .debug-drawer {
            margin-top: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .debug-drawer-header {
            padding: 8px 12px;
            background: var(--bg-card-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .debug-logs {
            padding: 8px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            color: var(--text-muted);
            max-height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }

        /* 微信内置浏览器防拦截蒙层 */
        .wechat-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            padding: 20px 24px;
            color: #ffffff;
        }

        .mask-arrow-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .mask-arrow-icon {
            width: 36px;
            height: 36px;
            color: #60a5fa;
            transform: rotate(-15deg);
        }

        .mask-content {
            width: 100%;
            text-align: center;
            margin-top: 60px;
        }

        .mask-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .mask-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* 📱 手机端原生全屏大图预览灯箱 */
        .mobile-lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(10, 15, 29, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeInLightbox 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes fadeInLightbox {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .mobile-lightbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), transparent);
            z-index: 10;
        }

        .mobile-lightbox-title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }

        .mobile-lightbox-close {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-lightbox-close:active {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(0.92);
        }

        .mobile-lightbox-body {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 苹果相册级平滑切图轨道舞台 (iOS Photos-Style Virtual Slider Stage) */
        .mobile-lightbox-slider-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            pointer-events: none;
        }

        .mobile-lightbox-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        /* 三槽位物理间隙：参照苹果相册设计，相邻图片之间保持 24px 黑色间隙 */
        .mobile-lightbox-slide.slide-prev {
            transform: translate3d(calc(-100% - 24px), 0, 0);
        }

        .mobile-lightbox-slide.slide-cur {
            transform: translate3d(0, 0, 0);
            z-index: 2;
        }

        .mobile-lightbox-slide.slide-next {
            transform: translate3d(calc(100% + 24px), 0, 0);
        }

        .mobile-lightbox-img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            user-select: none;
            -webkit-user-drag: none;
            will-change: transform;
            transform-origin: center center;
            touch-action: none;
        }

        .mobile-lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s ease;
            outline: none;
            padding: 0;
            opacity: 0.85;
            user-select: none;
        }

        .mobile-lightbox-nav-btn:active {
            transform: translateY(-50%) scale(0.92);
            background: rgba(15, 23, 42, 0.9);
            opacity: 1;
        }

        .mobile-lightbox-nav-btn.prev {
            left: 10px;
        }

        .mobile-lightbox-nav-btn.next {
            right: 10px;
        }

        .mobile-lightbox-counter-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        @keyframes zoomImg {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .mobile-lightbox-footer {
            padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.9), transparent);
            z-index: 10;
        }

        .mobile-lightbox-meta {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <!-- 顶部状态栏 -->
    <header class="app-header">
        <div class="brand-group">
            <span class="brand-icon">
                <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="1.5" width="9" height="13" rx="2" />
                    <line x1="7" y1="12" x2="9" y2="12" />
                </svg>
            </span>
            <span class="brand-title">PICVORA 隔空流转</span>
        </div>
        <div class="status-capsule" id="status-capsule">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">正在握手...</span>
        </div>
    </header>

    <main class="main-container">
        <!-- 会话主状态卡片 -->
        <section class="info-card" id="session-info-card">
            <div class="card-header-row">
                <span class="card-title">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="8" r="6" />
                        <polyline points="8 4 8 8 11 9" />
                    </svg>
                    <span id="target-device-name">PC 工作台直连通道</span>
                </span>
                <span style="font-size: 11px; color: var(--text-muted);" id="channel-type-badge">WebRTC 局域网</span>
            </div>
            <div class="card-desc" id="status-detail-desc">正在尝试连接电脑端投送节点，请保持本页面在前台运行...</div>

            <!-- 传输进度条 -->
            <div class="progress-bar-wrap" id="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <div class="progress-text-row" id="progress-text-row" style="display: none;">
                <span id="progress-count-text">正在传输 0/0 张</span>
                <span id="progress-pct-text">0%</span>
            </div>

            <!-- 异常一键重连按钮 -->
            <button type="button" class="btn btn-secondary btn-sm" id="btn-reconnect" style="display: none; margin-top: 10px; width: 100%; justify-content: center; gap: 6px;">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9L14 6" />
                    <path d="M14 2v4h-4" />
                </svg>
                重新尝试连接 PC
            </button>
        </section>

        <!-- 营销文案与爆款标签伴随面板 -->
        <section class="context-panel" id="context-panel">
            <div class="context-title" id="context-title">营销文案上下文</div>
            <div class="context-text" id="context-text">暂无文案</div>
            <div class="tag-list" id="tag-list"></div>
            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-copy-text">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4.5" y="4.5" width="8" height="8" rx="1.5" />
                        <path d="M3.5 11.5H2.5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1" />
                    </svg>
                    复制营销文案
                </button>
                <button type="button" class="btn btn-secondary" id="btn-copy-tags">复制全部标签</button>
            </div>
        </section>

        <!-- 九宫格素材流 -->
        <section id="gallery-section" style="display: none;">
            <div class="gallery-header-row" style="display: flex; align-items: center; justify-content: space-between;">
                <span class="gallery-counter" id="gallery-counter">已接收素材 (0 张)</span>
                <button type="button" class="btn btn-secondary btn-sm" id="btn-reset-gallery" style="display: none; padding: 3px 8px; font-size: 11px; gap: 4px;">
                    <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.5 8a5.5 5.5 0 1 1 1.6 3.9L2 14" />
                        <path d="M2 10v4h4" />
                    </svg>
                    恢复默认/就绪再传
                </button>
            </div>
            <div class="gallery-grid" id="gallery-grid"></div>
        </section>

        <!-- 底部一键转存相册面板 -->
        <div class="bottom-action-panel" id="bottom-action-panel">
            <button type="button" class="btn btn-primary btn-full" id="btn-save-album">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2v8.5M4.5 7.5L8 11l3.5-3.5" />
                    <rect x="2" y="11" width="12" height="3" rx="1" />
                </svg>
                一键转存系统相册
            </button>
            <button type="button" class="btn btn-secondary btn-full" id="btn-reset-bottom" style="margin-top: 8px; justify-content: center; gap: 6px;">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 8a5.5 5.5 0 1 1 1.6 3.9L2 14" />
                    <path d="M2 10v4h4" />
