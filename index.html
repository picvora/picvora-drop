    <script>
        (function () {
            'use strict';

            // 日志输出辅助
            const logBox = document.getElementById('debug-logs');
            function logDebug(msg) {
                const time = new Date().toTimeString().split(' ')[0];
                const line = `[${time}] ${msg}`;
                console.log('%c[Picvora Receiver] ' + msg, 'color:#3b82f6;');
                if (logBox) {
                    logBox.textContent += line + '\n';
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }

            // 1. 微信环境检测与拦截引导
            const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
            if (isWeChat) {
                const mask = document.getElementById('wechat-mask');
                if (mask) mask.style.display = 'flex';
                logDebug('检测到处于微信内置环境，已激活全屏引导跳板');
            }

            // 2. 解析 URL Hash 参数 (#host=pv-xxx&title=...&device=...)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const hostPeerId = params.get('host');
            const targetTitle = params.get('title') || 'Picvora 素材流转';
            const deviceName = params.get('device') || 'PC 工作台';

            if (deviceName) {
                document.getElementById('target-device-name').textContent = `${decodeURIComponent(deviceName)} 直连通道`;
            }

            if (!hostPeerId) {
                document.getElementById('status-text').textContent = '未指定主机';
                document.getElementById('status-detail-desc').textContent = '未在链接中检测到投送主机房号，请重新扫描 PC 端二维码。';
                logDebug('错误: 缺少 hostPeerId 参数');
                return;
            }

            // 3. UI 元素引用
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const statusDesc = document.getElementById('status-detail-desc');
            const progressWrap = document.getElementById('progress-bar-wrap');
            const progressFill = document.getElementById('progress-bar-fill');
            const progressRow = document.getElementById('progress-text-row');
            const progressCountText = document.getElementById('progress-count-text');
            const progressPctText = document.getElementById('progress-pct-text');
            const contextPanel = document.getElementById('context-panel');
            const contextTitle = document.getElementById('context-title');
            const contextText = document.getElementById('context-text');
            const tagList = document.getElementById('tag-list');
            const gallerySection = document.getElementById('gallery-section');
            const galleryGrid = document.getElementById('gallery-grid');
            const galleryCounter = document.getElementById('gallery-counter');
            const bottomAction = document.getElementById('bottom-action-panel');
            const btnSaveAlbum = document.getElementById('btn-save-album');
            const btnCopyText = document.getElementById('btn-copy-text');
            const btnCopyTags = document.getElementById('btn-copy-tags');
            const btnReconnect = document.getElementById('btn-reconnect');
            const btnResetGallery = document.getElementById('btn-reset-gallery');
            const btnResetBottom = document.getElementById('btn-reset-bottom');

            // 调试折叠
            document.getElementById('btn-toggle-debug').addEventListener('click', () => {
                const isHidden = logBox.style.display === 'none' || !logBox.style.display;
                logBox.style.display = isHidden ? 'block' : 'none';
                document.getElementById('debug-arrow').textContent = isHidden ? '▴' : '▾';
            });

            // 接收状态存储
            const receivedFiles = []; // [{ id, name, mimeType, blob, url, index }]
            let currentReceivingFile = null; // { id, name, size, mimeType, totalChunks, chunks: [] }
            let metaContext = null;

            // 国内外多源高可用 WebRTC STUN/TURN 穿透服务器池 (实测存活节点: 小米/B站/斗鱼/芒果TV + 全球免密 TCP 443 TURN 中继)
            const PEER_CONFIG = {
                iceServers: [
                    { urls: 'stun:stun.miwifi.com:3478' },
                    { urls: 'stun:stun.chat.bilibili.com:3478' },
                    { urls: 'stun:stun.douyucdn.cn:18000' },
                    { urls: 'stun:stun.hitv.com:3478' },
                    { urls: 'stun:stun.cloudflare.com:3478' },
                    // 全球高可用免密 TURN 中继 (优先 TCP 443 伪装 HTTPS 端口穿透防火墙与对称 NAT)
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ],
                sdpSemantics: 'unified-plan',
                iceCandidatePoolSize: 2
            };

            // 4. 连接状态机与退避重试控制器
            let mobilePeer = null;
            let activeConn = null;
            let retryCount = 0;
            const MAX_RETRIES = 3;
            let connectTimeoutTimer = null;
            let isP2POpen = false;

            function initMobilePeer() {
                if (mobilePeer && !mobilePeer.destroyed) {
                    try { mobilePeer.destroy(); } catch (_) {}
                    mobilePeer = null;
                }

                logDebug(`正在启动移动端 Peer 节点，准备呼叫 PC 主机: ${hostPeerId}`);
                statusText.textContent = '呼叫电脑端...';
                statusDot.className = 'status-dot';
                statusDesc.textContent = '正在连接公共信令服务，请保持本页面在前台运行...';
                if (btnReconnect) btnReconnect.style.display = 'none';

                try {
                    mobilePeer = new Peer({
                        host: '0.peerjs.com',
                        port: 443,
                        path: '/',
                        secure: true,
                        debug: 1,
                        config: PEER_CONFIG
                    });
                } catch (peerInitErr) {
                    logDebug(`初始化 Peer 实例异常: ${peerInitErr.message}`);
                    statusText.textContent = '初始化失败';
                    statusDesc.textContent = '移动端 WebRTC 模块启动异常，请刷新重试。';
                    if (btnReconnect) btnReconnect.style.display = 'flex';
                    return;
                }

                mobilePeer.on('open', (myId) => {
                    logDebug(`移动端节点已就绪: ${myId}，开始请求建立 DataChannel 直通管道...`);
                    retryCount = 0;
                    startConnecting();
                });

                mobilePeer.on('disconnected', () => {
                    logDebug('与公共信令服务连接暂时中断，正在尝试自动恢复...');
                    if (mobilePeer && !mobilePeer.destroyed) {
                        try { mobilePeer.reconnect(); } catch (_) {}
                    }
                });

                mobilePeer.on('error', (err) => {
                    logDebug(`PeerJS 异常: ${err.type || ''} ${err.message || ''}`);
                    
                    // 网络瞬断/心跳丢失，尝试自愈重连
                    if (err.type === 'network' || /lost connection/i.test(err.message || '')) {
                        logDebug('捕获到信令通道网络瞬断，执行自动重连...');
                        if (mobilePeer && !mobilePeer.destroyed) {
                            try { mobilePeer.reconnect(); } catch (_) {}
                        }
                        return;
                    }

                    // 目标主机房号不存在或已离线
                    if (err.type === 'peer-unavailable') {
                        statusText.textContent = '电脑端离线';
                        statusDesc.textContent = '未找到对应的电脑端投送节点。可能 PC 端投送窗口已关闭或二维码已过期，请在电脑端重新点击【传至手机】。';
                        statusDot.className = 'status-dot';
                        if (btnReconnect) btnReconnect.style.display = 'flex';
                        return;
                    }

                    // 其他异常
                    if (!isP2POpen) {
                        statusText.textContent = '信令异常';
                        statusDesc.textContent = `信令协商受限 (${err.type || err.message || '网络连接超时'})，请检查手机网络设置。`;
                        if (btnReconnect) btnReconnect.style.display = 'flex';
                    }
                });
            }

            // 提取底层 RTCPeerConnection 详细端点信息
            async function inspectEndpoints(pc, isFailureReport = false) {
                if (!pc) return null;
                try {
                    const stats = await pc.getStats();
                    const candidateMap = new Map();
                    const candidatePairs = [];
                    let selectedPair = null;

                    stats.forEach(report => {
                        if (report.type === 'local-candidate' || report.type === 'remote-candidate') {
                            candidateMap.set(report.id, report);
                        } else if (report.type === 'candidate-pair') {
                            candidatePairs.push(report);
                            if (report.selected || report.nominated || report.state === 'succeeded') {
                                selectedPair = report;
                            }
                        }
                    });

                    const formatCandidate = (c) => {
                        if (!c) return '未知端点';
                        const typeStr = c.candidateType || c.type || 'unknown';
                        const protoStr = (c.protocol || 'udp').toUpperCase();
                        const addr = c.address || c.ip || '';
                        const port = c.port || '';
                        const isMdns = /\.local$/i.test(addr);
                        return `${typeStr} [${protoStr}] ${addr}:${port}${isMdns ? ' (mDNS域名)' : ''}`;
                    };

                    if (selectedPair) {
                        const local = candidateMap.get(selectedPair.localCandidateId);
                        const remote = candidateMap.get(selectedPair.remoteCandidateId);
                        const rtt = selectedPair.currentRoundTripTime ? Math.round(selectedPair.currentRoundTripTime * 1000) + 'ms' : '极速';
                        const isRelay = (local && local.candidateType === 'relay') || (remote && remote.candidateType === 'relay');
                        const modeText = isRelay ? '云端 TURN 中继转发' : '局域网 P2P 直连';

                        logDebug(`================ 通信端点已锁定 ================`);
                        logDebug(`传输模式: ${modeText} (往返延迟: ${rtt})`);
                        logDebug(`手机端点: ${formatCandidate(local)}`);
                        logDebug(`电脑端点: ${formatCandidate(remote)}`);
                        logDebug(`=================================================`);
                        return { selectedPair, local, remote, modeText, rtt };
                    }

                    if (isFailureReport) {
                        logDebug(`------------- 未找到成功激活的通信端点对 -------------`);
                        if (candidatePairs.length === 0) {
                            logDebug(`暂无可用候选对 (可能未收到电脑候选或信令未对齐)`);
                        } else {
                            logDebug(`已尝试的候选对 (${candidatePairs.length} 组):`);
                            candidatePairs.slice(0, 5).forEach((pair, idx) => {
                                const local = candidateMap.get(pair.localCandidateId);
                                const remote = candidateMap.get(pair.remoteCandidateId);
                                logDebug(`  #${idx + 1} 手机: ${formatCandidate(local)} <-> 电脑: ${formatCandidate(remote)} | 状态: ${pair.state}`);
                            });
                        }
                        logDebug(`------------------------------------------------------`);
                    }
                } catch (err) {
                    logDebug(`解析端点统计异常: ${err.message}`);
                }
                return null;
            }

            let relayWarningTimer = null;

            function startConnecting() {
                if (isP2POpen) return;
                statusText.textContent = retryCount > 0 ? `建立直连 (重试 ${retryCount}/${MAX_RETRIES})...` : '建立 P2P 管道...';
                statusDesc.textContent = '正在通过局域网/STUN 协商点对点直连管道，请稍候...';

                if (activeConn) {
                    try { activeConn.close(); } catch (_) {}
                    activeConn = null;
                }

                if (relayWarningTimer) clearTimeout(relayWarningTimer);
                relayWarningTimer = setTimeout(() => {
                    if (!isP2POpen) {
                        logDebug('[进度提示] 局域网直连探测未通，继续尝试 TURN 云端中继穿透...');
                        statusDesc.textContent = '局域网直连探测受限，正在自动尝试 TURN 云端中继穿透...';
                    }
                }, 6000);

                // 16秒连接超时保护，预留足够的 TURN 中继穿透窗口
                if (connectTimeoutTimer) clearTimeout(connectTimeoutTimer);
                connectTimeoutTimer = setTimeout(async () => {
                    if (!isP2POpen) {
                        logDebug('WebRTC 协商超时 (16s 未完成握手)');
                        if (activeConn && activeConn.peerConnection) {
                            await inspectEndpoints(activeConn.peerConnection, true);
                        }
                        handleConnectionFailure('连接协商超时 (局域网单播可能被Windows防火墙/公用网络阻断)');
                    }
                }, 16000);

                try {
                    const conn = mobilePeer.connect(hostPeerId, {
                        reliable: true
                    });
                    activeConn = conn;

                    // 深度监听底层 WebRTC ICE 候选与状态机
                    try {
                        const bindPcDiagnostics = () => {
                            const pc = conn.peerConnection;
                            if (!pc) return;

                            // 拦截远端候选接入，实时打印电脑发来的端点
                            if (!pc._picvoraProxyBound && pc.addIceCandidate) {
                                pc._picvoraProxyBound = true;
                                const origAddIceCandidate = pc.addIceCandidate.bind(pc);
                                pc.addIceCandidate = function(candidate, ...args) {
                                    if (candidate && candidate.candidate) {
                                        const parts = candidate.candidate.trim().split(/\s+/);
                                        const proto = parts[2] ? parts[2].toUpperCase() : 'UDP';
                                        const ip = parts[4] || '';
                                        const port = parts[5] || '';
                                        const typIdx = parts.indexOf('typ');
                                        const type = typIdx !== -1 ? parts[typIdx + 1] : 'unknown';
                                        const isMdns = /\.local$/i.test(ip);
                                        logDebug(`[收到电脑端点] 类型: ${type} [${proto}] ${ip}:${port}${isMdns ? ' (PC mDNS混淆)' : ''}`);
                                    }
                                    return origAddIceCandidate(candidate, ...args);
                                };
                            }

                            pc.addEventListener('icecandidate', (evt) => {
                                if (evt.candidate) {
                                    const c = evt.candidate;
                                    logDebug(`[收集手机端点] 类型: ${c.type} [${(c.protocol || 'udp').toUpperCase()}] ${c.address || c.relatedAddress || ''}:${c.port}`);
                                } else {
                                    logDebug('[收集手机端点] 手机端本地候选收集完成');
                                }
                            });

                            pc.addEventListener('iceconnectionstatechange', async () => {
                                logDebug(`[ICE状态] 当前状态: ${pc.iceConnectionState}`);
                                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                                    logDebug('WebRTC 底层连接建立成功！');
                                    await inspectEndpoints(pc);
                                } else if (pc.iceConnectionState === 'failed') {
                                    logDebug('WebRTC 底层打洞失败 (候选对均未通达)');
                                    await inspectEndpoints(pc, true);
                                }
                            });

                            pc.addEventListener('connectionstatechange', () => {
                                logDebug(`[WebRTC状态] 全局状态: ${pc.connectionState}`);
                            });
                        };

                        if (conn.peerConnection) {
                            bindPcDiagnostics();
                        } else {
                            const checkTimer = setInterval(() => {
                                if (conn.peerConnection) {
                                    clearInterval(checkTimer);
                                    bindPcDiagnostics();
                                }
                            }, 50);
                            setTimeout(() => clearInterval(checkTimer), 2000);
                        }
                    } catch (_) {}

                    conn.on('open', async () => {
                        if (relayWarningTimer) clearTimeout(relayWarningTimer);
                        if (connectTimeoutTimer) clearTimeout(connectTimeoutTimer);
                        isP2POpen = true;
                        logDebug(`WebRTC DataChannel 握手成功！点对点传输管道已建立。`);
                        if (conn.peerConnection) {
                            await inspectEndpoints(conn.peerConnection);
                        }
                        statusDot.className = 'status-dot connected';
                        statusText.textContent = '已直连 PC';
                        statusDesc.textContent = '点对点直通管道已就绪，等待 PC 端推送原图二进制流...';
                        progressWrap.style.display = 'block';
                        progressRow.style.display = 'flex';
                        if (btnReconnect) btnReconnect.style.display = 'none';
                    });

                    conn.on('data', (data) => {
                        handleIncomingPacket(data);
                    });

                    conn.on('close', () => {
                        logDebug('DataChannel 连接已断开');
                        isP2POpen = false;
                        if (receivedFiles.length > 0) {
                            statusText.textContent = '传输完毕 (连接已释放)';
                            statusDesc.textContent = `已成功接收全部 ${receivedFiles.length} 张原图素材。`;
                        } else {
                            statusText.textContent = '连接已断开';
                            statusDesc.textContent = '与电脑端的通信管道已断开。';
                            if (btnReconnect) btnReconnect.style.display = 'flex';
                        }
                    });

                    conn.on('error', (err) => {
                        logDebug(`连接握手异常: ${err.message || String(err)}`);
                        handleConnectionFailure(err.message || String(err));
                    });
                } catch (connErr) {
                    logDebug(`发起连接异常: ${connErr.message}`);
                    handleConnectionFailure(connErr.message);
                }
            }

            function handleConnectionFailure(errMsg) {
                if (relayWarningTimer) clearTimeout(relayWarningTimer);
                if (connectTimeoutTimer) clearTimeout(connectTimeoutTimer);
                if (isP2POpen) return;

                // 针对 ICE 协商失败进行友好的中文白话解释
                let displayReason = errMsg;
                if (/negotiation.*failed/i.test(errMsg) || /ice.*failed/i.test(errMsg)) {
                    displayReason = '局域网打洞未通 (PC网络可能为"公用网络"导致防火墙阻断入站，或未开启专用网络共享)';
                }

                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    const delay = retryCount * 1500;
                    logDebug(`连接协商受阻 (${errMsg})，将于 ${delay}ms 后进行第 ${retryCount} 次自动重连...`);
                    statusText.textContent = `握手重试 (${retryCount}/${MAX_RETRIES})...`;
                    statusDesc.textContent = `网络协商抖动，正在自动切换中继重试... (${displayReason})`;
                    setTimeout(() => {
                        if (!isP2POpen && mobilePeer && !mobilePeer.destroyed) {
                            if (mobilePeer.disconnected) {
                                try { mobilePeer.reconnect(); } catch (_) {}
                            }
                            startConnecting();
                        }
                    }, delay);
                } else {
                    logDebug(`连接重试耗尽: ${errMsg}`);
                    statusText.textContent = '连接受阻';
                    statusDesc.textContent = `无法建立直连 (${displayReason})。建议：1. 确认两端处于同一 Wi-Fi；2. 检查 PC 网络是否设为"公用网络"；3. 点击下方重新连接。`;
                    statusDot.className = 'status-dot';
                    if (btnReconnect) btnReconnect.style.display = 'flex';
                }
            }

            // 监听页面前后台唤醒（防止熄屏或微信跳出切回时断线）
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    logDebug('页面重回前台，检查网络连接状态...');
                    if (mobilePeer && mobilePeer.disconnected && !mobilePeer.destroyed) {
                        logDebug('检测到后台期间信令中断，立即执行自动恢复...');
                        try { mobilePeer.reconnect(); } catch (_) {}
                    }
                    if (!isP2POpen && receivedFiles.length === 0) {
                        logDebug('尚未建立数据通道，重新触发连接握手...');
                        startConnecting();
                    }
                }
            });

            // 重新连接按钮绑定
            if (btnReconnect) {
                btnReconnect.addEventListener('click', () => {
                    logDebug('用户手动触发重新连接...');
                    retryCount = 0;
                    isP2POpen = false;
                    initMobilePeer();
                });
            }

            // 启动初始化
            initMobilePeer();

            // 5. 数据包接收与流式组装流水线
            function handleIncomingPacket(packet) {
                // 控制报文 (String JSON)
                if (typeof packet === 'string') {
                    try {
                        const msg = JSON.parse(packet);
                        if (msg.type === 'SESSION_START') {
                            logDebug(`收到会话元数据: 共 ${msg.totalCount} 张图, 大小 ${(msg.totalBytes / 1024 / 1024).toFixed(2)} MB`);
                            metaContext = msg;
                            renderContextPanel(msg);
                            gallerySection.style.display = 'block';
                        } else if (msg.type === 'FILE_START') {
                            logDebug(`开始接收素材: ${msg.name} (大小 ${(msg.size / 1024).toFixed(1)} KB, 切分 ${msg.totalChunks} 片)`);
                            currentReceivingFile = {
                                id: msg.fileId,
                                name: msg.name,
                                size: msg.size,
                                mimeType: msg.mimeType,
                                totalChunks: msg.totalChunks,
                                chunks: new Array(msg.totalChunks)
                            };
                        } else if (msg.type === 'FILE_END') {
                            assembleCurrentFile();
                        } else if (msg.type === 'SESSION_COMPLETE') {
                            logDebug(`全部素材已接收完毕！总计 ${receivedFiles.length} 个`);
                            statusDot.className = 'status-dot success';
                            statusText.textContent = '已全部接收';
                            statusDesc.textContent = `成功从 PC 原图直传 ${receivedFiles.length} 张素材，零损耗秒级送达。`;
                            progressFill.style.width = '100%';
                            progressPctText.textContent = '100%';
                            bottomAction.style.display = 'block';
                            if (btnResetGallery) btnResetGallery.style.display = 'inline-flex';
                        }
                    } catch (e) {
                        logDebug(`解析控制报文失败: ${e.message}`);
                    }
                    return;
                }

                // 二进制分片包识别与万能兼容归一化 (兼容 ArrayBuffer, Uint8Array 及任意 TypedArray/DataView)
                let rawBuffer = null;
                if (packet instanceof ArrayBuffer) {
                    rawBuffer = packet;
                } else if (ArrayBuffer.isView(packet)) {
                    rawBuffer = packet.buffer.slice(packet.byteOffset, packet.byteOffset + packet.byteLength);
                } else if (packet && packet.data instanceof ArrayBuffer) {
                    rawBuffer = packet.data;
                } else if (packet && ArrayBuffer.isView(packet.data)) {
                    rawBuffer = packet.data.buffer.slice(packet.data.byteOffset, packet.data.byteOffset + packet.data.byteLength);
                }

                if (rawBuffer && rawBuffer.byteLength >= 8) {
                    if (!currentReceivingFile) {
                        logDebug('[分片警告] 收到二进制数据块，但当前没有活动的接收任务');
                        return;
                    }
                    const view = new DataView(rawBuffer);
                    const chunkIndex = view.getUint32(0, false);
                    const totalChunks = view.getUint32(4, false);
                    const chunkPayload = rawBuffer.slice(8);

                    currentReceivingFile.chunks[chunkIndex] = chunkPayload;
                    currentReceivingFile.receivedChunksCount = (currentReceivingFile.receivedChunksCount || 0) + 1;

                    // 计算总体进度
                    const curCount = receivedFiles.length;
                    const totalCount = (metaContext && metaContext.totalCount) || 1;
                    const pct = Math.min(99, Math.round(((curCount + (chunkIndex / (currentReceivingFile.totalChunks || 1))) / totalCount) * 100));
                    progressFill.style.width = `${pct}%`;
                    progressPctText.textContent = `${pct}%`;
                    progressCountText.textContent = `正在传输 [${curCount + 1}/${totalCount}] ${currentReceivingFile.name} (分片 ${chunkIndex + 1}/${totalChunks})`;
                }
            }

            // 组装当前单张图片 Blob 并渲染卡片
            function assembleCurrentFile() {
                if (!currentReceivingFile) return;
                const { id, name, mimeType, chunks, size, totalChunks } = currentReceivingFile;

                // 严格校验分片有效性，杜绝 undefined 造成的 27 字节假文件
                const validParts = [];
                let totalReceivedBytes = 0;
                for (let i = 0; i < chunks.length; i++) {
                    const c = chunks[i];
                    if (c && c.byteLength > 0) {
                        validParts.push(c);
                        totalReceivedBytes += c.byteLength;
                    }
                }

                if (validParts.length === 0) {
                    logDebug(`[组装失败] 素材 ${name} 包含 0 个有效分片，丢弃破损空包`);
                    currentReceivingFile = null;
                    return;
                }

                if (validParts.length < chunks.length) {
                    logDebug(`[分片警告] 素材 ${name} 存在缺失分片 (${validParts.length}/${chunks.length})，已组装 ${totalReceivedBytes} 字节`);
                }

                const blob = new Blob(validParts, { type: mimeType || 'image/jpeg' });
                const blobUrl = URL.createObjectURL(blob);

                const item = {
                    id,
                    name,
                    mimeType,
                    blob,
                    url: blobUrl,
                    size: blob.size,
                    index: receivedFiles.length + 1
                };

                receivedFiles.push(item);
                logDebug(`组装素材成功: ${name} (真实体积: ${(blob.size / 1024).toFixed(1)} KB, 包含 ${validParts.length} 个数据分片)`);

                appendGalleryCard(item);
                galleryCounter.textContent = `已接收素材 (${receivedFiles.length} 张)`;
                if (btnResetGallery) btnResetGallery.style.display = 'inline-flex';

                currentReceivingFile = null;
            }

            // 渲染文案面板
            function renderContextPanel(meta) {
                if (!meta.title && !meta.desc && (!meta.tags || meta.tags.length === 0)) return;
                contextPanel.style.display = 'block';
                contextTitle.textContent = meta.title || '商品推广素材';
                contextText.textContent = meta.desc || meta.title || '';

                tagList.innerHTML = '';
                if (Array.isArray(meta.tags)) {
                    meta.tags.forEach(t => {
                        const span = document.createElement('span');
                        span.className = 'tag-item';
                        span.textContent = t.startsWith('#') ? t : `#${t}`;
                        tagList.appendChild(span);
                    });
                }
            }

            // 渲染单张九宫格卡片
            function appendGalleryCard(item) {
                const card = document.createElement('div');
                card.className = 'gallery-card';

                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;

                const seq = document.createElement('span');
                seq.className = 'card-seq-badge';
                seq.textContent = String(item.index).padStart(2, '0');

                const sizeBadge = document.createElement('span');
                sizeBadge.className = 'card-size-badge';
                sizeBadge.textContent = `${(item.size / 1024).toFixed(0)}K`;

                card.appendChild(img);
                card.appendChild(seq);
                card.appendChild(sizeBadge);

                // 点击卡片呼起沉浸式原生大图灯箱
                card.addEventListener('click', () => {
                    openMobileLightbox(item);
                });

                galleryGrid.appendChild(card);
            }

            // 📱 手机端全屏大图预览灯箱管理 (苹果相册级平滑切图轨道与独立双指缩放防页面变形)
            const mobileLightboxEl = document.getElementById('mobile-lightbox');
            const mobileLightboxTitle = document.getElementById('mobile-lightbox-title');
            const mobileLightboxCounter = document.getElementById('mobile-lightbox-counter');
            const mobileLightboxMeta = document.getElementById('mobile-lightbox-meta');
            const btnCloseMobileLightbox = document.getElementById('btn-close-mobile-lightbox');
            const btnLightboxSaveSingle = document.getElementById('btn-lightbox-save-single');
            const btnMobileLightboxPrev = document.getElementById('btn-mobile-lightbox-prev');
            const btnMobileLightboxNext = document.getElementById('btn-mobile-lightbox-next');
            const lightboxBody = document.getElementById('mobile-lightbox-body');

            // 三槽位平滑滑动舞台与图片元素
            const mobileLightboxStage = document.getElementById('mobile-lightbox-slider-stage');
            const slidePrevEl = document.getElementById('slide-prev');
            const slideCurEl = document.getElementById('slide-cur');
            const slideNextEl = document.getElementById('slide-next');
            const mobileLightboxImgPrev = document.getElementById('mobile-lightbox-img-prev');
            const mobileLightboxImg = document.getElementById('mobile-lightbox-img');
            const mobileLightboxImgNext = document.getElementById('mobile-lightbox-img-next');

            let currentLightboxIndex = -1;
            let currentLightboxItem = null;
            let isAnimatingSlide = false;

            // 图像缩放与平移独立状态 (只放大图片本身，绝不放大整个页面)
            let zoomScale = 1.0;
            let zoomPanX = 0;
            let zoomPanY = 0;
            let isPinching = false;
            let pinchStartDist = 0;
            let pinchStartScale = 1.0;
            let pinchStartCenter = { x: 0, y: 0 };
            let pinchStartPan = { x: 0, y: 0 };

            // 放大状态下的单指拖拽平移浏览
            let isPanningZoom = false;
            let panTouchStartX = 0;
            let panTouchStartY = 0;
            let panBaseX = 0;
            let panBaseY = 0;

            // 苹果相册经典双击快速缩放手势
            let lastTapTimestamp = 0;
            let lastTapPointX = 0;
            let lastTapPointY = 0;

            // 左右划动切图状态机
            let touchStartX = 0;
            let touchStartY = 0;
            let touchCurrentX = 0;
            let touchCurrentY = 0;
            let isTouching = false;
            let isHorizontalSwipe = false;
            let touchStartTime = 0;

            function getTouchDistance(t1, t2) {
                return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            }

            function getTouchCenter(t1, t2) {
                return {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
            }

            // 缩放归正
            function resetZoom(withAnimation = true) {
                zoomScale = 1.0;
                zoomPanX = 0;
                zoomPanY = 0;
                isPinching = false;
                isPanningZoom = false;
                if (mobileLightboxImg) {
                    if (withAnimation) {
                        mobileLightboxImg.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1)';
                    } else {
                        mobileLightboxImg.style.transition = 'none';
                    }
                    mobileLightboxImg.style.transform = 'translate3d(0, 0, 0) scale(1)';
                }
            }

            // 平移边界约束 (保证放大浏览时不至于拖出视口太远)
            function clampZoomPan(withAnimation = true) {
                if (zoomScale <= 1.05) {
                    resetZoom(withAnimation);
                    return;
                }
                const bodyRect = lightboxBody ? lightboxBody.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
                const maxPanX = Math.max(0, (bodyRect.width * (zoomScale - 1)) / 2);
                const maxPanY = Math.max(0, (bodyRect.height * (zoomScale - 1)) / 2);

                zoomPanX = Math.max(-maxPanX, Math.min(maxPanX, zoomPanX));
                zoomPanY = Math.max(-maxPanY, Math.min(maxPanY, zoomPanY));

                if (mobileLightboxImg) {
                    if (withAnimation) {
                        mobileLightboxImg.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1)';
                    } else {
                        mobileLightboxImg.style.transition = 'none';
                    }
                    mobileLightboxImg.style.transform = `translate3d(${zoomPanX}px, ${zoomPanY}px, 0) scale(${zoomScale})`;
                }
            }

            // 渲染三槽位滑块内容 (当前大图与前后预加载大图)
            function renderMobileLightboxSlides() {
                if (!receivedFiles || receivedFiles.length === 0) return;
                if (currentLightboxIndex < 0 || currentLightboxIndex >= receivedFiles.length) {
                    currentLightboxIndex = 0;
                }
                const total = receivedFiles.length;
                const curItem = receivedFiles[currentLightboxIndex];
                if (!curItem) return;
                currentLightboxItem = curItem;

                // 刷新主视口大图
                if (mobileLightboxImg) {
                    mobileLightboxImg.src = curItem.url;
                }
                resetZoom(false);

                // 刷新相邻预加载槽位
                if (total > 1) {
                    const prevIdx = (currentLightboxIndex - 1 + total) % total;
                    const nextIdx = (currentLightboxIndex + 1) % total;
                    if (mobileLightboxImgPrev) mobileLightboxImgPrev.src = receivedFiles[prevIdx].url;
                    if (mobileLightboxImgNext) mobileLightboxImgNext.src = receivedFiles[nextIdx].url;
                    if (slidePrevEl) slidePrevEl.style.display = 'flex';
                    if (slideNextEl) slideNextEl.style.display = 'flex';
                } else {
                    if (mobileLightboxImgPrev) mobileLightboxImgPrev.src = '';
                    if (mobileLightboxImgNext) mobileLightboxImgNext.src = '';
                    if (slidePrevEl) slidePrevEl.style.display = 'none';
                    if (slideNextEl) slideNextEl.style.display = 'none';
                }

                // 顶部标题与计数胶囊
                mobileLightboxTitle.textContent = curItem.name || '图片预览';
                const curPos = currentLightboxIndex + 1;
                if (mobileLightboxCounter) {
                    mobileLightboxCounter.textContent = `${curPos}/${total}`;
                    mobileLightboxCounter.style.display = total > 1 ? 'inline-block' : 'none';
                }
                if (btnMobileLightboxPrev) {
                    btnMobileLightboxPrev.style.display = total > 1 ? 'flex' : 'none';
                }
                if (btnMobileLightboxNext) {
                    btnMobileLightboxNext.style.display = total > 1 ? 'flex' : 'none';
                }

                const sizeText = curItem.size ? `${(curItem.size / 1024).toFixed(1)} KB` : '';
                if (mobileLightboxMeta) {
                    mobileLightboxMeta.textContent = `[${curPos}/${total}] · ${curItem.mimeType || 'JPEG'} · ${sizeText}`;
                }
            }

            // 苹果相册级平滑切图动画 (平滑平移滑动过渡)
            function animateSlideTransition(direction) {
                if (isAnimatingSlide || !receivedFiles || receivedFiles.length <= 1) return;
                isAnimatingSlide = true;
                resetZoom(false);

                const stageWidth = lightboxBody ? lightboxBody.clientWidth : window.innerWidth;
                const slideDistance = stageWidth + 24; // 包含 24px 黑色物理间距
                const targetOffset = direction > 0 ? -slideDistance : slideDistance;

                // 参照苹果相册平滑工学曲线
                if (mobileLightboxStage) {
                    mobileLightboxStage.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
                    mobileLightboxStage.style.transform = `translate3d(${targetOffset}px, 0, 0)`;
                }

                setTimeout(() => {
                    let nextIdx = currentLightboxIndex + direction;
                    if (nextIdx < 0) {
                        nextIdx = receivedFiles.length - 1;
                    } else if (nextIdx >= receivedFiles.length) {
                        nextIdx = 0;
                    }
                    currentLightboxIndex = nextIdx;

                    if (mobileLightboxStage) {
                        mobileLightboxStage.style.transition = 'none';
                        mobileLightboxStage.style.transform = 'translate3d(0, 0, 0)';
                    }
                    renderMobileLightboxSlides();
                    isAnimatingSlide = false;
                }, 280);
            }

            // 滑动未达阈值时的弹簧复位
            function springBackStage() {
                if (!mobileLightboxStage) return;
                mobileLightboxStage.style.transition = 'transform 0.24s cubic-bezier(0.25, 1, 0.5, 1)';
                mobileLightboxStage.style.transform = 'translate3d(0, 0, 0)';
            }

            function openMobileLightbox(item) {
                if (!mobileLightboxEl || !item) return;
                const idx = receivedFiles.findIndex(f => (f.id && f.id === item.id) || (f.url === item.url) || f === item);
                currentLightboxIndex = idx >= 0 ? idx : 0;
                if (mobileLightboxStage) {
                    mobileLightboxStage.style.transition = 'none';
                    mobileLightboxStage.style.transform = 'translate3d(0, 0, 0)';
                }
                renderMobileLightboxSlides();
                mobileLightboxEl.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            function closeMobileLightbox() {
                if (!mobileLightboxEl) return;
                mobileLightboxEl.style.display = 'none';
                resetZoom(false);
                if (mobileLightboxStage) {
                    mobileLightboxStage.style.transition = 'none';
                    mobileLightboxStage.style.transform = 'translate3d(0, 0, 0)';
                }
                if (mobileLightboxImg) mobileLightboxImg.src = '';
                if (mobileLightboxImgPrev) mobileLightboxImgPrev.src = '';
                if (mobileLightboxImgNext) mobileLightboxImgNext.src = '';
                currentLightboxItem = null;
                currentLightboxIndex = -1;
                document.body.style.overflow = '';
            }

            if (btnCloseMobileLightbox) {
                btnCloseMobileLightbox.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeMobileLightbox();
                });
            }

            // 左右导航按钮平滑切图
            if (btnMobileLightboxPrev) {
                btnMobileLightboxPrev.addEventListener('click', (e) => {
                    e.stopPropagation();
                    animateSlideTransition(-1);
                });
            }
            if (btnMobileLightboxNext) {
                btnMobileLightboxNext.addEventListener('click', (e) => {
                    e.stopPropagation();
                    animateSlideTransition(1);
                });
            }

            // 拦截 iOS Safari 默认的双指手势放大整个网页页面
            const preventSafariPageGesture = (e) => {
                if (e.cancelable) e.preventDefault();
            };
            if (mobileLightboxEl) {
                mobileLightboxEl.addEventListener('gesturestart', preventSafariPageGesture, { passive: false });
                mobileLightboxEl.addEventListener('gesturechange', preventSafariPageGesture, { passive: false });
                mobileLightboxEl.addEventListener('gestureend', preventSafariPageGesture, { passive: false });
            }

            // 👆 移动端手势引擎：苹果相册平滑切图 + 双指仅放大图片防页面缩放
            if (lightboxBody) {
                lightboxBody.addEventListener('touchstart', (e) => {
                    if (isAnimatingSlide) return;

                    // 1. 双指手势识别 -> 启动独立 Pinch-to-zoom 缩放图片
                    if (e.touches.length === 2) {
                        isPinching = true;
                        isTouching = false;
                        isHorizontalSwipe = false;
                        isPanningZoom = false;

                        springBackStage();

                        pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
                        pinchStartScale = zoomScale;
                        pinchStartCenter = getTouchCenter(e.touches[0], e.touches[1]);
                        pinchStartPan = { x: zoomPanX, y: zoomPanY };

                        if (mobileLightboxImg) mobileLightboxImg.style.transition = 'none';
                        return;
                    }

                    // 2. 单指触控识别
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        const now = Date.now();

                        // 苹果相册经典双击快速放大/还原手势
                        const tapDist = Math.hypot(touch.clientX - lastTapPointX, touch.clientY - lastTapPointY);
                        if (now - lastTapTimestamp < 300 && tapDist < 25) {
                            lastTapTimestamp = 0; // 消耗双击
                            if (zoomScale > 1.05) {
                                resetZoom(true);
                            } else {
                                const bodyRect = lightboxBody.getBoundingClientRect();
                                const clickCenterX = touch.clientX - (bodyRect.left + bodyRect.width / 2);
                                const clickCenterY = touch.clientY - (bodyRect.top + bodyRect.height / 2);
                                zoomScale = 2.5;
                                zoomPanX = -clickCenterX * 1.2;
                                zoomPanY = -clickCenterY * 1.2;
                                clampZoomPan(true);
                            }
                            isTouching = false;
                            isHorizontalSwipe = false;
                            isPanningZoom = false;
                            return;
                        }

                        lastTapTimestamp = now;
                        lastTapPointX = touch.clientX;
                        lastTapPointY = touch.clientY;

                        // 若当前处于放大模式下 -> 单指拖拽平移浏览大图局部
                        if (zoomScale > 1.05) {
                            isPanningZoom = true;
                            isTouching = false;
                            isHorizontalSwipe = false;
                            panTouchStartX = touch.clientX;
                            panTouchStartY = touch.clientY;
                            panBaseX = zoomPanX;
                            panBaseY = zoomPanY;
                            if (mobileLightboxImg) mobileLightboxImg.style.transition = 'none';
                            return;
                        }

                        // 若处于 1.0x 标准视口下 -> 准备左右划动平滑切图
                        isPanningZoom = false;
                        isTouching = true;
                        isHorizontalSwipe = false;
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                        touchCurrentX = touch.clientX;
                        touchCurrentY = touch.clientY;
                        touchStartTime = now;
                        if (mobileLightboxStage) mobileLightboxStage.style.transition = 'none';
                    }
                }, { passive: false });

                lightboxBody.addEventListener('touchmove', (e) => {
                    // 双指捏合/划开中：拦截系统页面缩放，只放大或缩小图片本身
                    if (isPinching && e.touches.length === 2) {
                        if (e.cancelable) e.preventDefault();
                        const curDist = getTouchDistance(e.touches[0], e.touches[1]);
                        const ratio = curDist / (pinchStartDist || 1);
                        let tempScale = pinchStartScale * ratio;
                        // 弹性手感边界
                        tempScale = Math.max(0.75, Math.min(4.5, tempScale));

                        const curCenter = getTouchCenter(e.touches[0], e.touches[1]);
                        const diffCenterX = curCenter.x - pinchStartCenter.x;
                        const diffCenterY = curCenter.y - pinchStartCenter.y;
                        zoomPanX = pinchStartPan.x + diffCenterX;
                        zoomPanY = pinchStartPan.y + diffCenterY;

                        if (mobileLightboxImg) {
                            mobileLightboxImg.style.transform = `translate3d(${zoomPanX}px, ${zoomPanY}px, 0) scale(${tempScale})`;
                        }
                        return;
                    }

                    // 放大状态下的单指拖拽平移浏览局部
                    if (isPanningZoom && e.touches.length === 1) {
                        if (e.cancelable) e.preventDefault();
                        const touch = e.touches[0];
                        const dx = touch.clientX - panTouchStartX;
                        const dy = touch.clientY - panTouchStartY;
                        zoomPanX = panBaseX + dx;
                        zoomPanY = panBaseY + dy;
                        if (mobileLightboxImg) {
                            mobileLightboxImg.style.transform = `translate3d(${zoomPanX}px, ${zoomPanY}px, 0) scale(${zoomScale})`;
                        }
                        return;
                    }

                    // 标准 1.0x 状态下的左右划动切图
                    if (isTouching && e.touches.length === 1 && zoomScale <= 1.05) {
                        touchCurrentX = e.touches[0].clientX;
                        touchCurrentY = e.touches[0].clientY;
                        const diffX = touchCurrentX - touchStartX;
                        const diffY = touchCurrentY - touchStartY;

                        if (!isHorizontalSwipe && Math.abs(diffX) > 8) {
                            if (Math.abs(diffX) > Math.abs(diffY)) {
                                isHorizontalSwipe = true;
                            }
                        }

                        if (isHorizontalSwipe && mobileLightboxStage) {
                            if (e.cancelable) e.preventDefault();
                            if (receivedFiles.length > 1) {
                                // 整个舞台随着手指位移，相邻图片实时跟着滑入
                                mobileLightboxStage.style.transform = `translate3d(${diffX}px, 0, 0)`;
                            } else {
                                // 单图施加微弹性阻尼
                                mobileLightboxStage.style.transform = `translate3d(${diffX * 0.18}px, 0, 0)`;
                            }
                        }
                    }
                }, { passive: false });

                const handleTouchEnd = (e) => {
                    // 双指捏合结束
                    if (isPinching) {
                        if (e.touches.length < 2) {
                            isPinching = false;
                            const curTransform = mobileLightboxImg ? mobileLightboxImg.style.transform : '';
                            const scaleMatch = curTransform.match(/scale\(([^)]+)\)/);
                            const finalScale = scaleMatch ? parseFloat(scaleMatch[1]) : zoomScale;
                            if (finalScale < 1.05) {
                                resetZoom(true);
                            } else {
                                zoomScale = Math.min(finalScale, 4.0);
                                clampZoomPan(true);
                            }
                        }
                        return;
                    }

                    // 放大模式单指浏览结束
                    if (isPanningZoom) {
                        isPanningZoom = false;
                        clampZoomPan(true);
                        return;
                    }

                    // 左右划动切图手势释放判定
                    if (isTouching) {
                        isTouching = false;
                        const diffX = touchCurrentX - touchStartX;
                        const diffY = touchCurrentY - touchStartY;
                        const dt = Date.now() - touchStartTime;

                        if (isHorizontalSwipe && receivedFiles.length > 1) {
                            const isQuickSwipe = dt < 320 && Math.abs(diffX) > 28;
                            const isLongSwipe = Math.abs(diffX) > Math.min(80, window.innerWidth * 0.22);
                            if ((isQuickSwipe || isLongSwipe) && Math.abs(diffX) > Math.abs(diffY)) {
                                if (diffX < 0) {
                                    // 向左滑 -> 切换到下一张
                                    animateSlideTransition(1);
                                } else {
                                    // 向右滑 -> 切换到上一张
                                    animateSlideTransition(-1);
                                }
                                return;
                            }
                        }

                        // 未达切换阈值，弹性归位
                        springBackStage();
                    }
                };

                lightboxBody.addEventListener('touchend', handleTouchEnd, { passive: true });
                lightboxBody.addEventListener('touchcancel', handleTouchEnd, { passive: true });
            }

            // 点击大图主体外部遮罩空白区域安全关闭
            if (mobileLightboxEl) {
                mobileLightboxEl.addEventListener('click', (e) => {
                    if (e.target === mobileLightboxEl || 
                        e.target.id === 'mobile-lightbox-body' || 
                        e.target.id === 'mobile-lightbox-slider-stage' || 
                        e.target.classList.contains('mobile-lightbox-slide')) {
                        closeMobileLightbox();
                    }
                });
            }

            // 单图保存
            if (btnLightboxSaveSingle) {
                btnLightboxSaveSingle.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!currentLightboxItem) return;
                    const item = currentLightboxItem;
                    const fileToShare = new File([item.blob], item.name, { type: item.mimeType || 'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
                        try {
                            await navigator.share({
                                files: [fileToShare],
                                title: item.name
                            });
                            return;
                        } catch (err) {
                            if (err.name === 'AbortError') return;
                        }
                    }
                    // 降级下载
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.download = item.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
            }

            // 键盘操作 (ESC 关闭、左右箭头平滑切图)
            window.addEventListener('keydown', (e) => {
                if (mobileLightboxEl && mobileLightboxEl.style.display !== 'none') {
                    if (e.key === 'Escape') {
                        closeMobileLightbox();
                    } else if (e.key === 'ArrowLeft') {
                        animateSlideTransition(-1);
                    } else if (e.key === 'ArrowRight') {
                        animateSlideTransition(1);
                    }
                }
            });

            // 6. 一键转存系统相册 (Web Share API)
            btnSaveAlbum.addEventListener('click', async () => {
                if (receivedFiles.length === 0) return;

                // 尝试构建 File 列表
                const filesToShare = receivedFiles.map(rf => {
                    return new File([rf.blob], rf.name, { type: rf.mimeType || 'image/jpeg' });
                });

                // 检测是否支持 Web Share API Files 格式
                if (navigator.canShare && navigator.canShare({ files: filesToShare })) {
                    try {
                        logDebug('正在唤起系统原生分享面板转存相册...');
                        await navigator.share({
                            files: filesToShare,
                            title: metaContext?.title || 'Picvora 素材',
                            text: '来自 PC 端 Picvora 局域网隔空直传'
                        });
                        logDebug('系统分享面板唤起并完成');
                    } catch (shareErr) {
                        if (shareErr.name !== 'AbortError') {
                            logDebug(`系统分享调用异常: ${shareErr.message}，降级逐张下载`);
                            fallbackDownloadAll();
                        }
                    }
                } else {
                    logDebug('当前浏览器环境不支持 Web Share 多文件直传，启用逐张下载模式');
                    fallbackDownloadAll();
                }
            });

            function fallbackDownloadAll() {
                receivedFiles.forEach((rf, i) => {
                    setTimeout(() => {
                        const a = document.createElement('a');
                        a.href = rf.url;
                        a.download = rf.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }, i * 200);
                });
                alert('已为您触发批量下载，请在系统下载管理器中查收并移入相册。');
            }

            // 复制文案与标签
            btnCopyText.addEventListener('click', () => {
                const text = contextText.textContent || '';
                navigator.clipboard.writeText(text).then(() => {
                    btnCopyText.textContent = '已复制到剪贴板！';
                    setTimeout(() => { btnCopyText.textContent = '复制营销文案'; }, 2000);
                }).catch(() => {
                    alert('复制失败，请手动长按文字复制');
                });
            });

            btnCopyTags.addEventListener('click', () => {
                const tags = Array.from(tagList.querySelectorAll('.tag-item')).map(el => el.textContent).join(' ');
                navigator.clipboard.writeText(tags).then(() => {
                    btnCopyTags.textContent = '标签已复制！';
                    setTimeout(() => { btnCopyTags.textContent = '复制全部标签'; }, 2000);
                }).catch(() => {
                    alert('复制失败，请手动长按文字复制');
                });
            });

            // 7. 一键清空恢复到默认状态 (以备再次接收，保持 P2P 直连)
            function resetToDefaultState() {
                logDebug('用户手动触发清空接收站，恢复初始就绪状态...');
                closeMobileLightbox();
                // 释放已接收图片的 Blob URL 内存
                receivedFiles.forEach(rf => {
                    try { URL.revokeObjectURL(rf.url); } catch (_) {}
                });
                receivedFiles.length = 0;
                currentReceivingFile = null;
                metaContext = null;

                // 清空画廊 DOM
                galleryGrid.innerHTML = '';
                gallerySection.style.display = 'none';
                galleryCounter.textContent = '已接收素材 (0 张)';
                if (btnResetGallery) btnResetGallery.style.display = 'none';
                bottomAction.style.display = 'none';
                contextPanel.style.display = 'none';

                // 重置进度条
                progressFill.style.width = '0%';
                progressPctText.textContent = '0%';
                progressCountText.textContent = '等待电脑端推流...';

                // 保持已连通状态
                if (isP2POpen) {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '已直连 PC (待命)';
                    statusDesc.textContent = '素材列表已清空，局域网管道保持通畅。请在电脑端继续选择新素材进行推送！';
                } else {
                    statusDot.className = 'status-dot';
                    statusText.textContent = '准备就绪';
                    statusDesc.textContent = '等待电脑端连接...';
                }
            }

            if (btnResetGallery) {
                btnResetGallery.addEventListener('click', resetToDefaultState);
            }
            if (btnResetBottom) {
                btnResetBottom.addEventListener('click', resetToDefaultState);
            }

        })();
    </script>
</body>
