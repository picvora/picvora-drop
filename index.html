<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Picvora 隔空接收站</title>
    <!-- 引入 PeerJS 核心库 (优先使用公共 CDN，支持离线或镜像) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --border-subtle: #edf2f7;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #d97706;
            --danger: #dc2626;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #0b0f19;
                --bg-card: #131c2e;
                --bg-card-subtle: #1e293b;
                --border-color: #24324d;
                --border-subtle: #1a253a;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --primary-light: rgba(59, 130, 246, 0.15);
                --success: #22c55e;
                --success-light: rgba(34, 197, 94, 0.15);
                --warning: #f59e0b;
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* 顶部导航与状态条 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(var(--bg-card), 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-capsule {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: var(--bg-card-subtle);
            border: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .status-dot.connected {
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pulse 1.8s infinite;
        }

        .status-dot.success {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* 主体内容流 */
        .main-container {
            flex: 1;
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 状态与进度卡片 */
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* 进度条 */
        .progress-bar-wrap {
            height: 6px;
            background: var(--bg-card-subtle);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin: 8px 0;
            display: none;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            border-radius: var(--radius-full);
            transition: width 0.15s ease-out;
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 文案与标签复制专区 */
        .context-panel {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .context-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .context-text {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card-subtle);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag-item {
            font-size: 11px;
            padding: 3px 8px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-full);
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:active {
            background-color: var(--primary-hover);
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-card-subtle);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:active {
            background-color: var(--border-color);
            transform: scale(0.98);
        }

        .btn-full {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border-radius: var(--radius-lg);
        }

        /* 九宫格素材展示区 */
        .gallery-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 8px 0;
        }

        .gallery-counter {
            font-size: 13px;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gallery-card {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--bg-card-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-seq-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .card-size-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* 底部常驻保存操作面板 */
        .bottom-action-panel {
            position: sticky;
            bottom: 12px;
            z-index: 40;
            margin-top: auto;
            display: none;
        }

        /* 调试日志抽屉 */
        .debug-drawer {
            margin-top: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .debug-drawer-header {
            padding: 8px 12px;
            background: var(--bg-card-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .debug-logs {
            padding: 8px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            color: var(--text-muted);
            max-height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }

        /* 微信内置浏览器防拦截蒙层 */
        .wechat-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            padding: 20px 24px;
            color: #ffffff;
        }

        .mask-arrow-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .mask-arrow-icon {
            width: 36px;
            height: 36px;
            color: #60a5fa;
            transform: rotate(-15deg);
        }

        .mask-content {
            width: 100%;
            text-align: center;
            margin-top: 60px;
        }

        .mask-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .mask-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <!-- 顶部状态栏 -->
    <header class="app-header">
        <div class="brand-group">
            <span class="brand-icon">
                <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="1.5" width="9" height="13" rx="2" />
                    <line x1="7" y1="12" x2="9" y2="12" />
                </svg>
            </span>
            <span class="brand-title">PICVORA 隔空流转</span>
        </div>
        <div class="status-capsule" id="status-capsule">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">正在握手...</span>
        </div>
    </header>

    <main class="main-container">
        <!-- 会话主状态卡片 -->
        <section class="info-card" id="session-info-card">
            <div class="card-header-row">
                <span class="card-title">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="8" r="6" />
                        <polyline points="8 4 8 8 11 9" />
                    </svg>
                    <span id="target-device-name">PC 工作台直连通道</span>
                </span>
                <span style="font-size: 11px; color: var(--text-muted);" id="channel-type-badge">WebRTC 局域网</span>
            </div>
            <div class="card-desc" id="status-detail-desc">正在尝试连接电脑端投送节点，请保持本页面在前台运行...</div>

            <!-- 传输进度条 -->
            <div class="progress-bar-wrap" id="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <div class="progress-text-row" id="progress-text-row" style="display: none;">
                <span id="progress-count-text">正在传输 0/0 张</span>
                <span id="progress-pct-text">0%</span>
            </div>
        </section>

        <!-- 营销文案与爆款标签伴随面板 -->
        <section class="context-panel" id="context-panel">
            <div class="context-title" id="context-title">营销文案上下文</div>
            <div class="context-text" id="context-text">暂无文案</div>
            <div class="tag-list" id="tag-list"></div>
            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-copy-text">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4.5" y="4.5" width="8" height="8" rx="1.5" />
                        <path d="M3.5 11.5H2.5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1" />
                    </svg>
                    复制营销文案
                </button>
                <button type="button" class="btn btn-secondary" id="btn-copy-tags">复制全部标签</button>
            </div>
        </section>

        <!-- 九宫格素材流 -->
        <section id="gallery-section" style="display: none;">
            <div class="gallery-header-row">
                <span class="gallery-counter" id="gallery-counter">已接收素材 (0 张)</span>
                <span style="font-size: 11px; color: var(--text-muted);">点按任意素材可检视大图</span>
            </div>
            <div class="gallery-grid" id="gallery-grid"></div>
        </section>

        <!-- 底部一键转存相册面板 -->
        <div class="bottom-action-panel" id="bottom-action-panel">
            <button type="button" class="btn btn-primary btn-full" id="btn-save-album">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2v8.5M4.5 7.5L8 11l3.5-3.5" />
                    <rect x="2" y="11" width="12" height="3" rx="1" />
                </svg>
                一键转存系统相册
            </button>
        </div>

        <!-- 实时调试日志抽屉 -->
        <div class="debug-drawer">
            <div class="debug-drawer-header" id="btn-toggle-debug">
                <span>实时网络与分片诊断日志</span>
                <span id="debug-arrow">▾</span>
            </div>
            <div class="debug-logs" id="debug-logs"></div>
        </div>
    </main>

    <!-- 微信环境防拦截提示蒙层 -->
    <div class="wechat-mask" id="wechat-mask">
        <div class="mask-arrow-hint">
            <span style="font-size: 14px; font-weight: 600;">点击右上角 [...]</span>
            <svg class="mask-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
        </div>
        <div class="mask-content">
            <h2 class="mask-title">请在系统默认浏览器中打开</h2>
            <p class="mask-desc">微信内置浏览器限制局域网 WebRTC 直连与相册保存权限。<br>请点击右上角菜单，选择【在系统默认浏览器中打开】即可享受秒级原图直传！</p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // 日志输出辅助
            const logBox = document.getElementById('debug-logs');
            function logDebug(msg) {
                const time = new Date().toTimeString().split(' ')[0];
                const line = `[${time}] ${msg}`;
                console.log('%c[Picvora Receiver] ' + msg, 'color:#3b82f6;');
                if (logBox) {
                    logBox.textContent += line + '\n';
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }

            // 1. 微信环境检测与拦截引导
            const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
            if (isWeChat) {
                const mask = document.getElementById('wechat-mask');
                if (mask) mask.style.display = 'flex';
                logDebug('检测到处于微信内置环境，已激活全屏引导跳板');
            }

            // 2. 解析 URL Hash 参数 (#host=pv-xxx&title=...&device=...)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const hostPeerId = params.get('host');
            const targetTitle = params.get('title') || 'Picvora 素材流转';
            const deviceName = params.get('device') || 'PC 工作台';

            if (deviceName) {
                document.getElementById('target-device-name').textContent = `${decodeURIComponent(deviceName)} 直连通道`;
            }

            if (!hostPeerId) {
                document.getElementById('status-text').textContent = '未指定主机';
                document.getElementById('status-detail-desc').textContent = '未在链接中检测到投送主机房号，请重新扫描 PC 端二维码。';
                logDebug('错误: 缺少 hostPeerId 参数');
                return;
            }

            // 3. UI 元素引用
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const statusDesc = document.getElementById('status-detail-desc');
            const progressWrap = document.getElementById('progress-bar-wrap');
            const progressFill = document.getElementById('progress-bar-fill');
            const progressRow = document.getElementById('progress-text-row');
            const progressCountText = document.getElementById('progress-count-text');
            const progressPctText = document.getElementById('progress-pct-text');
            const contextPanel = document.getElementById('context-panel');
            const contextTitle = document.getElementById('context-title');
            const contextText = document.getElementById('context-text');
            const tagList = document.getElementById('tag-list');
            const gallerySection = document.getElementById('gallery-section');
            const galleryGrid = document.getElementById('gallery-grid');
            const galleryCounter = document.getElementById('gallery-counter');
            const bottomAction = document.getElementById('bottom-action-panel');
            const btnSaveAlbum = document.getElementById('btn-save-album');
            const btnCopyText = document.getElementById('btn-copy-text');
            const btnCopyTags = document.getElementById('btn-copy-tags');

            // 调试折叠
            document.getElementById('btn-toggle-debug').addEventListener('click', () => {
                const isHidden = logBox.style.display === 'none' || !logBox.style.display;
                logBox.style.display = isHidden ? 'block' : 'none';
                document.getElementById('debug-arrow').textContent = isHidden ? '▴' : '▾';
            });

            // 接收状态存储
            const receivedFiles = []; // [{ id, name, mimeType, blob, url, index }]
            let currentReceivingFile = null; // { id, name, size, mimeType, totalChunks, chunks: [] }
            let metaContext = null;

            // 4. 初始化 PeerJS 并发起向 PC 端的连接
            logDebug(`正在启动移动端 Peer 节点，准备呼叫 PC 主机: ${hostPeerId}`);
            statusText.textContent = '呼叫电脑端...';

            const mobilePeer = new Peer({
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                secure: true,
                debug: 1
            });

            mobilePeer.on('open', (myId) => {
                logDebug(`移动端节点已就绪: ${myId}，正在请求建立 DataChannel...`);
                statusText.textContent = '建立 P2P 管道...';

                const conn = mobilePeer.connect(hostPeerId, {
                    reliable: true
                });

                conn.on('open', () => {
                    logDebug(`WebRTC DataChannel 握手成功！局域网直通通道已建立。`);
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '已直连 PC';
                    statusDesc.textContent = '局域网点对点管道已通，等待 PC 端推送原图二进制流...';
                    progressWrap.style.display = 'block';
                    progressRow.style.display = 'flex';
                });

                conn.on('data', (data) => {
                    handleIncomingPacket(data);
                });

                conn.on('close', () => {
                    logDebug('DataChannel 连接已断开');
                    if (receivedFiles.length > 0) {
                        statusText.textContent = '传输完毕 (连接已释放)';
                    } else {
                        statusText.textContent = '连接已断开';
                    }
                });

                conn.on('error', (err) => {
                    logDebug(`连接故障: ${err.message || String(err)}`);
                    statusText.textContent = '连接异常';
                    statusDesc.textContent = `P2P 通信错误: ${err.message || String(err)}`;
                });
            });

            mobilePeer.on('error', (err) => {
                logDebug(`PeerJS 异常: ${err.type || ''} ${err.message || ''}`);
                statusText.textContent = '信令异常';
                statusDesc.textContent = `无法连接公共信令通道，请检查手机外网访问权限。`;
            });

            // 5. 数据包接收与流式组装流水线
            function handleIncomingPacket(packet) {
                // 控制报文 (String JSON)
                if (typeof packet === 'string') {
                    try {
                        const msg = JSON.parse(packet);
                        if (msg.type === 'SESSION_START') {
                            logDebug(`收到会话元数据: 共 ${msg.totalCount} 张图, 大小 ${(msg.totalBytes / 1024 / 1024).toFixed(2)} MB`);
                            metaContext = msg;
                            renderContextPanel(msg);
                            gallerySection.style.display = 'block';
                        } else if (msg.type === 'FILE_START') {
                            logDebug(`开始接收素材: ${msg.name} (大小 ${(msg.size / 1024).toFixed(1)} KB, 切分 ${msg.totalChunks} 片)`);
                            currentReceivingFile = {
                                id: msg.fileId,
                                name: msg.name,
                                size: msg.size,
                                mimeType: msg.mimeType,
                                totalChunks: msg.totalChunks,
                                chunks: new Array(msg.totalChunks)
                            };
                        } else if (msg.type === 'FILE_END') {
                            assembleCurrentFile();
                        } else if (msg.type === 'SESSION_COMPLETE') {
                            logDebug(`全部素材已接收完毕！总计 ${receivedFiles.length} 个`);
                            statusDot.className = 'status-dot success';
                            statusText.textContent = '已全部接收';
                            statusDesc.textContent = `成功从 PC 原图直传 ${receivedFiles.length} 张素材，零损耗秒级送达。`;
                            progressFill.style.width = '100%';
                            progressPctText.textContent = '100%';
                            bottomAction.style.display = 'block';
                        }
                    } catch (e) {
                        logDebug(`解析控制报文失败: ${e.message}`);
                    }
                    return;
                }

                // 二进制分片包 (ArrayBuffer)
                if (packet instanceof ArrayBuffer) {
                    if (!currentReceivingFile) return;
                    const view = new DataView(packet);
                    const chunkIndex = view.getUint32(0, false);
                    const chunkPayload = packet.slice(8);

                    currentReceivingFile.chunks[chunkIndex] = chunkPayload;

                    // 计算总体进度
                    const curCount = receivedFiles.length;
                    const totalCount = (metaContext && metaContext.totalCount) || 1;
                    const pct = Math.min(99, Math.round(((curCount + (chunkIndex / currentReceivingFile.totalChunks)) / totalCount) * 100));
                    progressFill.style.width = `${pct}%`;
                    progressPctText.textContent = `${pct}%`;
                    progressCountText.textContent = `正在传输 [${curCount + 1}/${totalCount}] ${currentReceivingFile.name}`;
                }
            }

            // 组装当前单张图片 Blob 并渲染卡片
            function assembleCurrentFile() {
                if (!currentReceivingFile) return;
                const { id, name, mimeType, chunks, size } = currentReceivingFile;
                const blob = new Blob(chunks, { type: mimeType || 'image/jpeg' });
                const blobUrl = URL.createObjectURL(blob);

                const item = {
                    id,
                    name,
                    mimeType,
                    blob,
                    url: blobUrl,
                    size: blob.size,
                    index: receivedFiles.length + 1
                };

                receivedFiles.push(item);
                logDebug(`组装素材成功: ${name} (${(blob.size / 1024).toFixed(1)} KB)`);

                appendGalleryCard(item);
                galleryCounter.textContent = `已接收素材 (${receivedFiles.length} 张)`;

                currentReceivingFile = null;
            }

            // 渲染文案面板
            function renderContextPanel(meta) {
                if (!meta.title && !meta.desc && (!meta.tags || meta.tags.length === 0)) return;
                contextPanel.style.display = 'block';
                contextTitle.textContent = meta.title || '商品推广素材';
                contextText.textContent = meta.desc || meta.title || '';

                tagList.innerHTML = '';
                if (Array.isArray(meta.tags)) {
                    meta.tags.forEach(t => {
                        const span = document.createElement('span');
                        span.className = 'tag-item';
                        span.textContent = t.startsWith('#') ? t : `#${t}`;
                        tagList.appendChild(span);
                    });
                }
            }

            // 渲染单张九宫格卡片
            function appendGalleryCard(item) {
                const card = document.createElement('div');
                card.className = 'gallery-card';

                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;

                const seq = document.createElement('span');
                seq.className = 'card-seq-badge';
                seq.textContent = String(item.index).padStart(2, '0');

                const sizeBadge = document.createElement('span');
                sizeBadge.className = 'card-size-badge';
                sizeBadge.textContent = `${(item.size / 1024).toFixed(0)}K`;

                card.appendChild(img);
                card.appendChild(seq);
                card.appendChild(sizeBadge);

                // 点击预览大图
                card.addEventListener('click', () => {
                    const w = window.open();
                    if (w) {
                        w.document.write(`<img src="${item.url}" style="max-width:100%;height:auto;display:block;margin:auto;">`);
                    }
                });

                galleryGrid.appendChild(card);
            }

            // 6. 一键转存系统相册 (Web Share API)
            btnSaveAlbum.addEventListener('click', async () => {
                if (receivedFiles.length === 0) return;

                // 尝试构建 File 列表
                const filesToShare = receivedFiles.map(rf => {
                    return new File([rf.blob], rf.name, { type: rf.mimeType || 'image/jpeg' });
                });

                // 检测是否支持 Web Share API Files 格式
                if (navigator.canShare && navigator.canShare({ files: filesToShare })) {
                    try {
                        logDebug('正在唤起系统原生分享面板转存相册...');
                        await navigator.share({
                            files: filesToShare,
                            title: metaContext?.title || 'Picvora 素材',
                            text: '来自 PC 端 Picvora 局域网隔空直传'
                        });
                        logDebug('系统分享面板唤起并完成');
                    } catch (shareErr) {
                        if (shareErr.name !== 'AbortError') {
                            logDebug(`系统分享调用异常: ${shareErr.message}，降级逐张下载`);
                            fallbackDownloadAll();
                        }
                    }
                } else {
                    logDebug('当前浏览器环境不支持 Web Share 多文件直传，启用逐张下载模式');
                    fallbackDownloadAll();
                }
            });

            function fallbackDownloadAll() {
                receivedFiles.forEach((rf, i) => {
                    setTimeout(() => {
                        const a = document.createElement('a');
                        a.href = rf.url;
                        a.download = rf.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }, i * 200);
                });
                alert('已为您触发批量下载，请在系统下载管理器中查收并移入相册。');
            }

            // 复制文案与标签
            btnCopyText.addEventListener('click', () => {
                const text = contextText.textContent || '';
                navigator.clipboard.writeText(text).then(() => {
                    btnCopyText.textContent = '已复制到剪贴板！';
                    setTimeout(() => { btnCopyText.textContent = '复制营销文案'; }, 2000);
                }).catch(() => {
                    alert('复制失败，请手动长按文字复制');
                });
            });

            btnCopyTags.addEventListener('click', () => {
                const tags = Array.from(tagList.querySelectorAll('.tag-item')).map(el => el.textContent).join(' ');
                navigator.clipboard.writeText(tags).then(() => {
                    btnCopyTags.textContent = '标签已复制！';
                    setTimeout(() => { btnCopyTags.textContent = '复制全部标签'; }, 2000);
                }).catch(() => {
                    alert('复制失败，请手动长按文字复制');
                });
            });

        })();
    </script>
</body>

</html>
